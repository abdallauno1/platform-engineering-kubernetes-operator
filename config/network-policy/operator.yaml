apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-platform-operator
  namespace: ai-platform-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-platform-operator
      app.kubernetes.io/component: controller-manager
  policyTypes: [Ingress, Egress]
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - {}
