apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-operator-controller-manager
  namespace: ai-platform-system
  labels:
    app.kubernetes.io/name: ai-platform-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-platform-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-platform-operator
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: ai-platform-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ai-platform-operator:day3
          imagePullPolicy: IfNotPresent
          args:
            - --mode=operator
            - --health-addr=:8081
            - --reconcile-interval=30s
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
